services:
  postgres:
    image: postgres:17
    container_name: shopsys-postgres

    environment:
      POSTGRES_DB: shopsys
      POSTGRES_USER: shopsys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - shopsys_postgres_data:/var/lib/postgresql/data

volumes:
  shopsys_postgres_data: