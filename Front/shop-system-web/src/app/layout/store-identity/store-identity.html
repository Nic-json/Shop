<div class="store-identity">
  <div class="store-logo">
    @if (logoUrl && !logoComErro) {
      <img
        [src]="logoUrl"
        [alt]="'Logo de ' + nomeEmpresa"
        (error)="logoComErro = true"
      />
    } @else {
      <span>{{ iniciais }}</span>
    }
  </div>

  <div class="store-info">
    <strong>{{ nomeEmpresa }}</strong>
    <span>{{ nomeLoja }}</span>
  </div>
</div>
